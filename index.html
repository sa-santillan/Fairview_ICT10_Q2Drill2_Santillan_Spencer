<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT Club Member Manager</title>
<link rel="stylesheet"
href="https://pyscript.net/releases/2026.7.3/core.css">
<script type="module"
src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    
<style>
    body {
        background-color: #101a14;
        color: #d6f5df;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        }
    
    .container {
        background-color: #171f1a;
        border: 2px solid #39965b;
        width: 500px;
        max-width: 90%;
        margin: 30px auto;
        padding: 25px;
        border-radius: 12px;
        box-sizing: border-box;
        }

    h2 {
        color: #55e887;
        text-align: center;
        }

        /* Styles both input boxes */
    input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        background-color: #090e0b;
        color: white;
        border: 1px solid #39965b;
        border-radius: 8px;
        box-sizing: border-box;
        }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        background-color: #176b36;
        color: white;
        border: 1px solid #55e887;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        }

        button:hover {
            background-color: #238849;
        }

        #result {
            background-color: #090e0b;
            border: 1px solid #39965b;
            border-radius: 8px;
            padding: 18px;
            margin-top: 20px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }
</style>
</head>

<body>
<div class="container">
    <h2>ADD NEW CLUB MEMBER</h2>
    
    <input type="text" id="first_name" placeholder="First Name">
    <input type="text" id="last_name" placeholder="Last Name">
    <button type="button" py-click="add_club_member">SUBMIT</button>
    
<div id="result"></div>
<script type="py" src="main.py"></script>

</body>
</html>
